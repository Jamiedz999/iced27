[project]
name = "fuzzy-search-algorithm"
version = "0.1.0"
description = "Moving-window fuzzy passage matcher extracted from uCeltic, for optimisation work."
requires-python = ">=3.9"
dependencies = ["rapidfuzz>=3.9", "numpy>=1.24"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fuzzysearch"]
